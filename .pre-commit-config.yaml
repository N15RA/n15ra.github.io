# 提交前自動執行的 formatter / 基礎檢查。
# 安裝：pre-commit install；手動全跑：pre-commit run --all-files

# 排除：old-website/ 為忠實的舊站備份（archival dump），須逐字保留、勿格式化。
exclude: '^old-website/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
# Prettier 已隨 Astro 應用移除；待新框架選定後，連同其 package.json 與 pinned
# 版本以 local hook 重新導入。清理期間僅保留與框架無關的 base hooks。
