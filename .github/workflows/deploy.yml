# 部署到 GitHub Pages（user/org pages repo，服務於根網域）。
# 一次性設定：Repo → Settings → Pages → Build and deployment → Source = "GitHub Actions"。
# 自訂網域 nisra.net cutover 時：把 astro.config 的 site 改為 https://www.nisra.net，
# 並在 public/ 加入 CNAME 檔（內容為網域）。本 workflow 不需更動。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小權限：只給 Pages 部署所需。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署，但不取消進行中的（避免半成品上線）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 明確步驟（取代 withastro/action）：插入 CN 字體還原步驟，讓 prebuild 能依
    # 當前內容重新子集化（避免新中文字 fallback 成不同字體）。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22 # 對齊 mise.toml
          cache: npm
      - uses: ./.github/actions/cn-fonts
      - run: npm ci
      - name: Build（prebuild 會先重新子集 CN 字體，再 astro build）
        run: npm run build
      # @v3 為 actions/upload-pages-artifact 官方 README 現行示範版本（非過時），
      # 與 deploy-pages@v5 相容；日後官方改 recommended major 再升。
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
